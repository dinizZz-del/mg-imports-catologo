<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html,body{margin:0;min-height:100%;background:#0b0b0b;color:#f5f5f5;font-family:Arial,sans-serif}
    *{box-sizing:border-box}.wrap{padding:16px}.head{display:flex;gap:10px;align-items:center;margin-bottom:16px}
    .logo{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:#e50914;color:#fff;font-weight:900;font-size:19px}
    h1{margin:0;font-size:18px}.muted{color:#909090;font-size:11px}.section{background:#151515;border:1px solid #292929;border-radius:14px;padding:13px;margin-bottom:10px}
    .section h2{font-size:11px;margin:0 0 11px;color:#bbb;text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}
    label{font-size:10px;color:#aaa;display:block}input,select,textarea{display:block;width:100%;margin-top:5px;padding:9px;border-radius:9px;border:1px solid #303030;background:#0d0d0d;color:#f4f4f4;outline:none}
    textarea{min-height:64px;resize:vertical}.checks{display:flex;gap:8px}.check{display:flex;align-items:center;gap:7px;background:#0d0d0d;border:1px solid #303030;border-radius:9px;padding:9px;flex:1;font-size:10px}.check input{width:auto;margin:0}
    .sizes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.size-row{display:grid;grid-template-columns:auto 1fr 60px;gap:7px;align-items:center;background:#0d0d0d;border:1px solid #303030;border-radius:9px;padding:7px}.size-row input{margin:0}.size-row input[type=checkbox]{width:auto}
    .preview{margin-top:8px;height:145px;border:1px dashed #343434;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#666;background:#0d0d0d}.preview img{width:100%;height:100%;object-fit:cover}
    .btn{width:100%;padding:12px;border:0;border-radius:10px;background:#e50914;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.status{display:block;margin:0 0 10px;padding:10px;border-radius:9px;font-size:11px;background:#161616;color:#aaa}.status.ok{background:#0c2a1b;color:#82e9ae}.status.err{background:#351015;color:#ff9ba1}.hidden{display:none}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo">C</div><div><h1>Novo produto</h1><div class="muted">Painel privado do catálogo</div></div></div>
  <div id="status" class="status">Carregando dados da planilha...</div>

  <form id="form" class="hidden">
    <div class="section"><h2>Produto</h2><div class="grid">
      <label class="full">Nome / descrição<input name="name" required placeholder="Ex.: Corinthians Home 26/27"></label>
      <label>Time / seleção<input name="team" required></label>
      <label>Temporada<input name="season" required placeholder="2026/27"></label>
      <label>Modelo<select name="model" id="model" required></select></label>
      <label>Categoria<select name="category" id="category" required></select></label>
      <label class="full">Subcategoria<select name="subcategory" id="subcategory"><option value="">Sem subcategoria</option></select></label>
    </div></div>

    <div class="section"><h2>Catálogo</h2><div class="grid">
      <label>Disponibilidade<select name="availability" id="availability"><option value="Pronta entrega">Pronta entrega</option><option value="Sob encomenda">Sob encomenda</option></select></label>
      <label>Prazo de encomenda<input name="leadTime" placeholder="Ex.: 15–25 dias"></label>
      <label class="full">Descrição pública<textarea name="description"></textarea></label>
      <div class="full checks"><label class="check"><input type="checkbox" name="show" checked> Exibir no catálogo</label><label class="check"><input type="checkbox" name="featured"> Destaque</label></div>
    </div></div>

    <div class="section"><h2>Preço e estoque</h2><div class="grid">
      <label>Preço de venda<input name="price" type="number" step="0.01" min="0" required></label>
      <label>Fornecedor<input name="supplier"></label>
      <label>Custo unitário<input name="cost" type="number" step="0.01" min="0"></label>
      <label>Frete/taxa unit.<input name="freight" type="number" step="0.01" min="0"></label>
      <div class="full"><label>Tamanhos e quantidade</label><div id="sizes" class="sizes"></div></div>
    </div></div>

    <div class="section"><h2>Imagem</h2><label>URL da imagem ou Google Drive<input name="image" id="image" placeholder="https://..."></label><div id="preview" class="preview">Prévia</div></div>
    <button id="save" class="btn" type="submit">CADASTRAR PRODUTO</button>
  </form>
</div>
<script>
(function(){
  function byId(id){ return document.getElementById(id); }
  function esc(value){
    return String(value || '').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
  }
  function setStatus(text,type){
    var el=byId('status'); el.textContent=text; el.className='status'+(type?' '+type:'');
  }
  function fillSelect(id,values,first){
    var el=byId(id), html='<option value="">'+(first||'Selecione')+'</option>';
    (values||[]).forEach(function(v){ html += '<option value="'+esc(v)+'">'+esc(v)+'</option>'; });
    el.innerHTML=html;
  }
  function load(){
    setStatus('Carregando dados da planilha...','');
    google.script.run
      .withSuccessHandler(function(data){
        if(!data || data.ok !== true){ setStatus('Não foi possível carregar o painel.','err'); return; }
        fillSelect('model',data.models,'Selecione');
        fillSelect('category',data.categories,'Selecione');
        fillSelect('subcategory',data.subcategories,'Sem subcategoria');
        var html='';
        (data.sizes||[]).forEach(function(s){
          html += '<div class="size-row"><input type="checkbox" data-size-check="'+esc(s)+'"><b>'+esc(s)+'</b><input type="number" min="0" value="0" data-size-qty="'+esc(s)+'" title="Quantidade"></div>';
        });
        byId('sizes').innerHTML=html || '<div class="muted">Nenhum tamanho encontrado na aba Categorias.</div>';
        byId('form').className='';
        setStatus('Painel carregado. Preencha os dados do produto.','ok');
      })
      .withFailureHandler(function(err){
        setStatus('Erro ao carregar: '+((err && err.message)?err.message:String(err)),'err');
      })
      .getAdminBootstrap();
  }

  byId('image').addEventListener('input',function(e){
    var u=String(e.target.value||'').trim();
    var m=u.match(/\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/);
    if(m) u='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1200';
    byId('preview').innerHTML=u?'<img src="'+esc(u)+'" onerror="this.parentNode.textContent=\'Não foi possível carregar a prévia\'">':'Prévia';
  });

  byId('availability').addEventListener('change',function(e){
    if(e.target.value==='Sob encomenda'){
      var q=document.querySelectorAll('[data-size-qty]');
      for(var i=0;i<q.length;i++) q[i].value=0;
    }
  });

  byId('form').addEventListener('submit',function(e){
    e.preventDefault();
    var form=e.target, fd=new FormData(form), sizes=[];
    var checks=document.querySelectorAll('[data-size-check]');
    for(var i=0;i<checks.length;i++){
      if(checks[i].checked){
        var s=checks[i].getAttribute('data-size-check');
        var qtyInput=document.querySelector('[data-size-qty="'+CSS.escape(s)+'"]');
        sizes.push({size:s,qty:Number(qtyInput ? qtyInput.value : 0)});
      }
    }
    var payload={
      name:fd.get('name'),team:fd.get('team'),season:fd.get('season'),model:fd.get('model'),category:fd.get('category'),subcategory:fd.get('subcategory'),
      availability:fd.get('availability'),leadTime:fd.get('leadTime'),description:fd.get('description'),show:fd.get('show')==='on',featured:fd.get('featured')==='on',
      price:fd.get('price'),supplier:fd.get('supplier'),cost:fd.get('cost'),freight:fd.get('freight'),image:fd.get('image'),sizes:sizes
    };
    byId('save').disabled=true; setStatus('Salvando produto...','');
    google.script.run
      .withSuccessHandler(function(r){byId('save').disabled=false;setStatus((r&&r.message)||'Produto salvo.','ok');form.reset();byId('preview').textContent='Prévia';load();})
      .withFailureHandler(function(err){byId('save').disabled=false;setStatus('Erro ao salvar: '+((err&&err.message)?err.message:String(err)),'err');})
      .saveCatalogProduct(payload);
  });

  load();
})();
</script>
</body>
</html>
